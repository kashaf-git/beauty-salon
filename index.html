<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChristyAn Beauty Studio – Booking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:       #7ec8c8;
      --teal-dark:  #4a9e9e;
      --teal-light: #d6f0f0;
      --orange:     #d4622a;
      --orange-light:#f0d0c0;
      --white:      #ffffff;
      --text:       #2a2a2a;
      --grey:       #f5f5f5;
      --border:     #ddd;
      --shadow:     0 4px 18px rgba(0,0,0,0.10);
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #b2dede 0%, #e8f7f7 100%);
      min-height: 100vh;
      color: var(--text);
    }

    /* ── NAV ── */
    header {
      background: var(--white);
      box-shadow: var(--shadow);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 46px; height: 46px;
      background: var(--teal-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900;
      color: var(--orange);
      border: 2px solid var(--teal);
      font-family: Georgia, serif;
      font-style: italic;
    }

    .logo-text {
      display: flex; flex-direction: column; line-height: 1.1;
    }

    .logo-text .brand {
      font-size: 20px; font-weight: 700;
      font-family: Georgia, serif;
      color: var(--orange); /* "An" is orange by default */
    }

    .logo-text .brand span { color: var(--text); } /* "Christy" is black */
    .logo-text .brand .diamond { color: var(--text); } /* diamond is black */
    .logo-text .sub { font-size: 11px; letter-spacing: 3px; color: var(--text); text-transform: uppercase; }

    nav { display: flex; gap: 8px; }

    nav button {
      padding: 9px 22px;
      border: 2px solid var(--teal);
      border-radius: 30px;
      background: transparent;
      color: var(--teal-dark);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }

    nav button.active, nav button:hover {
      background: var(--teal-dark);
      color: var(--white);
      border-color: var(--teal-dark);
    }

    /* ── PAGES ── */
    .page { display: none; padding: 36px 32px; max-width: 1200px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── BOOKING PAGE ── */
    .booking-wrapper {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 28px;
      align-items: start;
    }

    .card {
      background: var(--white);
      border-radius: 18px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-family: Georgia, serif;
      font-size: 22px;
      color: var(--teal-dark);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--teal-light);
      display: flex; align-items: center; gap: 8px;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--teal-dark);
      margin-bottom: 6px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      background: var(--grey);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(126,200,200,.2);
      background: var(--white);
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Services grid */
    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .service-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all .2s;
      background: var(--grey);
      font-size: 13px;
      font-weight: 500;
      user-select: none;
      text-transform: none;
      letter-spacing: normal;
      margin-bottom: 0;
      color: var(--text);
    }

    .service-chip input[type="checkbox"] {
      display: none;
      width: auto;
      padding: 0;
      border: none;
      background: none;
    }

    .service-chip .dot {
      width: 18px; height: 18px;
      border-radius: 5px;
      border: 2px solid var(--border);
      background: var(--white);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }

    .service-chip.selected {
      border-color: var(--teal-dark);
      background: var(--teal-light);
    }

    .service-chip.selected .dot {
      background: var(--teal-dark);
      border-color: var(--teal-dark);
    }

    .service-chip.selected .dot::after {
      content: '✓';
      color: white;
      font-size: 11px;
      font-weight: 900;
    }

    .service-chip .emoji { font-size: 18px; }

    .btn-book {
      width: 100%;
      padding: 14px;
      background: var(--orange);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .5px;
      margin-top: 8px;
      transition: background .2s, transform .1s;
    }

    .btn-book:hover { background: #b5511f; transform: translateY(-1px); }
    .btn-book:active { transform: translateY(0); }

    /* Sidebar summary */
    .appt-list { list-style: none; margin-top: 4px; }

    .appt-item {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      background: var(--teal-light);
      border-left: 4px solid var(--teal-dark);
      font-size: 13px;
    }

    .appt-item .name { font-weight: 700; font-size: 14px; color: var(--text); }
    .appt-item .time { color: var(--teal-dark); font-weight: 600; margin: 2px 0; }
    .appt-item .services { color: #666; }

    .appt-item .delete-btn {
      float: right;
      background: none;
      border: none;
      color: #c00;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0;
    }

    .empty-msg { color: #aaa; font-size: 13px; text-align: center; padding: 20px 0; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--teal-dark);
      color: white;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform .35s ease;
      z-index: 999;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── CALENDAR PAGE ── */
    .cal-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .cal-header h2 {
      font-family: Georgia, serif;
      font-size: 22px;
      color: var(--teal-dark);
      flex: 1;
    }

    .cal-nav-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--teal);
      background: var(--white);
      color: var(--teal-dark);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }

    .cal-nav-btn:hover { background: var(--teal-dark); color: var(--white); border-color: var(--teal-dark); }

    .view-toggle { display: flex; gap: 6px; }

    .view-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--teal);
      background: transparent;
      color: var(--teal-dark);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }

    .view-btn.active, .view-btn:hover {
      background: var(--teal-dark);
      color: white;
      border-color: var(--teal-dark);
    }

    /* Monthly grid */
    .month-grid {
      background: var(--white);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .month-days-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--teal-dark);
    }

    .month-days-header div {
      padding: 12px 0;
      text-align: center;
      color: white;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .month-body {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .month-cell {
      min-height: 100px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 8px;
      cursor: pointer;
      transition: background .15s;
    }

    .month-cell:hover { background: var(--teal-light); }
    .month-cell.other-month { background: #fafafa; }
    .month-cell.today { background: #fff8f0; }

    .cell-date {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }

    .month-cell.today .cell-date {
      background: var(--orange);
      color: white;
    }

    .cell-appt {
      font-size: 11px;
      background: var(--teal);
      color: white;
      border-radius: 4px;
      padding: 2px 5px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Week / Day view */
    .week-view {
      background: var(--white);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .week-header-row {
      display: grid;
      background: var(--teal-dark);
    }

    .week-header-row .time-col {
      width: 70px; min-width: 70px;
      background: var(--teal-dark);
    }

    .week-day-head {
      padding: 10px 6px;
      text-align: center;
      color: white;
      font-size: 12px;
      font-weight: 700;
      border-left: 1px solid rgba(255,255,255,.2);
    }

    .week-day-head.today { background: var(--orange); }
    .week-day-head .day-num { font-size: 20px; line-height: 1; }

    .week-body {
      overflow-y: auto;
      max-height: 600px;
    }

    .week-time-row {
      display: grid;
      min-height: 60px;
      border-bottom: 1px solid var(--border);
    }

    .week-time-row .time-label {
      width: 70px; min-width: 70px;
      padding: 6px 10px;
      font-size: 11px;
      color: #888;
      font-weight: 600;
      border-right: 1px solid var(--border);
      text-align: right;
    }

    .week-cell {
      border-left: 1px solid var(--border);
      padding: 2px 4px;
      position: relative;
      cursor: pointer;
      transition: background .15s;
    }

    .week-cell:hover { background: var(--teal-light); }

    .week-appt {
      background: var(--teal);
      color: white;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 2px;
      cursor: pointer;
      border-left: 3px solid var(--teal-dark);
    }

    .week-appt.orange { background: var(--orange-light); color: var(--orange); border-left-color: var(--orange); }
    .week-appt.pink { background: #fce4f0; color: #c0559a; border-left-color: #c0559a; }
    .week-appt.blue { background: #ddeeff; color: #3377bb; border-left-color: #3377bb; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 18px;
      padding: 32px;
      width: 420px;
      max-width: 95vw;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      animation: pop .25s ease;
    }

    @keyframes pop {
      from { transform: scale(.9); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }

    .modal h3 { font-family: Georgia, serif; color: var(--teal-dark); font-size: 20px; margin-bottom: 16px; }
    .modal .detail { margin-bottom: 8px; font-size: 14px; }
    .modal .detail strong { color: var(--teal-dark); }
    .modal .close-btn {
      margin-top: 20px; width: 100%;
      padding: 11px;
      border: none; border-radius: 10px;
      background: var(--teal-dark); color: white;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }

    @media (max-width: 760px) {
      .booking-wrapper { grid-template-columns: 1fr; }
      .services-grid { grid-template-columns: 1fr; }
      .row-2 { grid-template-columns: 1fr; }
      header { padding: 0 16px; }
      .page { padding: 24px 16px; }
    }
  </style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header>
  <div class="logo-area">
    <div class="logo-icon">Ch</div>
    <div class="logo-text">
      <span class="brand"><span>Christy</span>An <span class="diamond">◆</span></span>
      <span class="sub">Beauty Studio</span>
    </div>
  </div>
  <nav>
    <button class="active" onclick="showPage('booking', this)">📅 Book Appointment</button>
    <button onclick="showPage('calendar', this)">🗓 Calendar</button>
  </nav>
</header>

<!-- ═══════════ BOOKING PAGE ═══════════ -->
<div class="page active" id="page-booking">
  <div class="booking-wrapper">

    <!-- Form -->
    <div class="card">
      <h2>💅 Book an Appointment</h2>

      <div class="form-group">
        <label>Customer Name</label>
        <input type="text" id="f-name" placeholder="e.g. Sophie Williams" />
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="f-date" />
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="f-time" />
        </div>
      </div>

      <div class="form-group">
        <label>Stylist / Therapist</label>
        <select id="f-stylist">
          <option value="">— Select Staff Member —</option>
          <option>Maria</option>
          <option>Christy</option>
          <option>Sophie</option>
          <option>Leanne</option>
          <option>Any Available</option>
        </select>
      </div>

      <div class="form-group">
        <label>Services (select all that apply)</label>
        <div class="services-grid" id="services-grid">
          <label class="service-chip">
            <input type="checkbox" value="Facial Treatment"/>
            <span class="dot"></span>
            <span class="emoji">✨</span> Facial Treatment
          </label>
          <label class="service-chip">
            <input type="checkbox" value="Pedicure"/>
            <span class="dot"></span>
            <span class="emoji">🦶</span> Pedicure
          </label>
          <label class="service-chip">
            <input type="checkbox" value="Manicure"/>
            <span class="dot"></span>
            <span class="emoji">💅</span> Manicure
          </label>
          <label class="service-chip">
            <input type="checkbox" value="Mani &amp; Pedi"/>
            <span class="dot"></span>
            <span class="emoji">🌸</span> Mani &amp; Pedi
          </label>
          <label class="service-chip">
            <input type="checkbox" value="Hair Styling"/>
            <span class="dot"></span>
            <span class="emoji">💇</span> Hair Styling
          </label>
          <label class="service-chip">
            <input type="checkbox" value="Makeup"/>
            <span class="dot"></span>
            <span class="emoji">💄</span> Makeup
          </label>
          <label class="service-chip">
            <input type="checkbox" value="Eyelash Thickening"/>
            <span class="dot"></span>
            <span class="emoji">👁️</span> Eyelash Thickening
          </label>
          <label class="service-chip">
            <input type="checkbox" value="Nail Art"/>
            <span class="dot"></span>
            <span class="emoji">🎨</span> Nail Art
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea id="f-notes" rows="3" placeholder="Any special requests or notes…"></textarea>
      </div>

      <button class="btn-book" onclick="bookAppointment()">✦ Confirm Appointment</button>
    </div>

    <!-- Sidebar: upcoming -->
    <div class="summary-card">
      <div class="card">
        <h2>🗓 Upcoming Appointments</h2>
        <ul class="appt-list" id="appt-list">
          <li class="empty-msg" id="empty-msg">No appointments yet</li>
        </ul>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════ CALENDAR PAGE ═══════════ -->
<div class="page" id="page-calendar">

  <div class="cal-header">
    <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
    <h2 id="cal-title">Month</h2>
    <button class="cal-nav-btn" onclick="calNav(1)">›</button>
    <button class="view-btn active" id="vbtn-month" onclick="setView('month',this)">Month</button>
    <button class="view-btn" id="vbtn-week" onclick="setView('week',this)">Week</button>
    <button class="view-btn" id="vbtn-day" onclick="setView('day',this)">Day</button>
    <button class="cal-nav-btn" style="margin-left:auto" title="Jump to today" onclick="goToday()">●</button>
  </div>

  <div id="cal-container"></div>
</div>

<!-- ═══════════ MODAL ═══════════ -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>📋 Appointment Details</h3>
    <div id="modal-body"></div>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ═══════════ SCRIPT ═══════════ -->
<script>
  // ── DB (localStorage) ──────────────────────────────────────────────
  const DB_KEY = 'christyan_appointments';

  function loadDB() {
    try { return JSON.parse(localStorage.getItem(DB_KEY)) || []; }
    catch { return []; }
  }

  function saveDB(data) {
    localStorage.setItem(DB_KEY, JSON.stringify(data));
  }

  function getAppointments() { return loadDB(); }

  function addAppointment(appt) {
    const data = loadDB();
    appt.id = Date.now().toString();
    data.push(appt);
    saveDB(data);
    return appt;
  }

  function deleteAppointment(id) {
    const data = loadDB().filter(a => a.id !== id);
    saveDB(data);
  }

  // ── SERVICE CHIPS ──────────────────────────────────────────────────
  document.getElementById('services-grid').addEventListener('change', function(e) {
    if (e.target.type === 'checkbox') {
      e.target.closest('.service-chip').classList.toggle('selected', e.target.checked);
    }
  });

  // ── NAVIGATION ─────────────────────────────────────────────────────
  function showPage(name, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'calendar') renderCal();
    if (name === 'booking') renderSidebar();
  }

  // ── BOOKING ────────────────────────────────────────────────────────
  function bookAppointment() {
    const name    = document.getElementById('f-name').value.trim();
    const date    = document.getElementById('f-date').value;
    const time    = document.getElementById('f-time').value;
    const stylist = document.getElementById('f-stylist').value;
    const notes   = document.getElementById('f-notes').value.trim();

    const checked  = document.querySelectorAll('#services-grid input[type="checkbox"]:checked');
    const services = Array.from(checked).map(c => c.value);

    if (!name)            { showToast('⚠️ Please enter a customer name.'); return; }
    if (!date)            { showToast('⚠️ Please select a date.'); return; }
    if (!time)            { showToast('⚠️ Please select a time.'); return; }
    if (!services.length) { showToast('⚠️ Please select at least one service.'); return; }

    const appt = { name, date, time, stylist, services, notes };
    addAppointment(appt);

    // Reset form
    document.getElementById('f-name').value    = '';
    document.getElementById('f-date').value    = toDateStr(today);
    document.getElementById('f-time').value    = '';
    document.getElementById('f-stylist').value = '';
    document.getElementById('f-notes').value   = '';
    document.querySelectorAll('#services-grid input[type="checkbox"]').forEach(cb => {
      cb.checked = false;
      cb.closest('.service-chip').classList.remove('selected');
    });

    renderSidebar();
    showToast('✅ Appointment booked for ' + name + '!');
  }

  // ── SIDEBAR ────────────────────────────────────────────────────────
  function renderSidebar() {
    const list = document.getElementById('appt-list');
    const data = getAppointments().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    list.innerHTML = '';
    if (!data.length) {
      list.innerHTML = '<li class="empty-msg">No appointments yet</li>';
      return;
    }

    data.forEach(a => {
      const li = document.createElement('li');
      li.className = 'appt-item';
      li.innerHTML = `
        <button class="delete-btn" onclick="removeAppt('${a.id}')">✕</button>
        <div class="name">${esc(a.name)}</div>
        <div class="time">📅 ${fmtDate(a.date)} · ⏰ ${a.time}</div>
        <div class="services">${esc(a.services.join(', '))}</div>
        ${a.stylist ? `<div class="services">👤 ${esc(a.stylist)}</div>` : ''}
      `;
      list.appendChild(li);
    });
  }

  function removeAppt(id) {
    deleteAppointment(id);
    renderSidebar();
    if (document.getElementById('page-calendar').classList.contains('active')) renderCal();
    showToast('Appointment removed.');
  }

  // ── CALENDAR STATE ─────────────────────────────────────────────────
  let calView = 'month';
  const today = new Date();
  let calDate = new Date(today);

  function setView(v, btn) {
    calView = v;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCal();
  }

  function calNav(dir) {
    if (calView === 'month')     calDate.setMonth(calDate.getMonth() + dir);
    else if (calView === 'week') calDate.setDate(calDate.getDate() + dir * 7);
    else                         calDate.setDate(calDate.getDate() + dir);
    renderCal();
  }

  function goToday() { calDate = new Date(today); renderCal(); }

  function renderCal() {
    if (calView === 'month') renderMonth();
    else renderWeekDay();
  }

  // ── MONTH VIEW ─────────────────────────────────────────────────────
  function renderMonth() {
    const year  = calDate.getFullYear();
    const month = calDate.getMonth();
    document.getElementById('cal-title').textContent =
      calDate.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

    const appts   = getAppointments();
    const apptMap = {};
    appts.forEach(a => { (apptMap[a.date] = apptMap[a.date] || []).push(a); });

    const firstDay    = new Date(year, month, 1).getDay();
    const offset      = (firstDay + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr    = toDateStr(today);

    let html = `<div class="month-grid">
      <div class="month-days-header">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div>${d}</div>`).join('')}
      </div>
      <div class="month-body">`;

    const total = Math.ceil((offset + daysInMonth) / 7) * 7;

    for (let i = 0; i < total; i++) {
      const dayNum = i - offset + 1;
      let cellClass = 'month-cell';
      let displayNum = '';
      let dateStr = '';

      if (dayNum < 1) {
        cellClass += ' other-month';
        const prev = new Date(year, month, dayNum);
        displayNum = prev.getDate();
        dateStr = toDateStr(prev);
      } else if (dayNum > daysInMonth) {
        cellClass += ' other-month';
        const next = new Date(year, month, dayNum);
        displayNum = next.getDate();
        dateStr = toDateStr(next);
      } else {
        displayNum = dayNum;
        dateStr = toDateStr(new Date(year, month, dayNum));
        if (dateStr === todayStr) cellClass += ' today';
      }

      const dayAppts = apptMap[dateStr] || [];
      const shown    = dayAppts.slice(0, 3);
      const extra    = dayAppts.length - shown.length;

      html += `<div class="${cellClass}" onclick="calDayClick('${dateStr}')">
        <div class="cell-date">${displayNum}</div>
        ${shown.map(a => `<div class="cell-appt">${esc(a.name)}</div>`).join('')}
        ${extra > 0 ? `<div class="cell-appt">+${extra} more</div>` : ''}
      </div>`;
    }

    html += '</div></div>';
    document.getElementById('cal-container').innerHTML = html;
  }

  function calDayClick(dateStr) {
    const appts = getAppointments().filter(a => a.date === dateStr);
    if (!appts.length) return;
    const body = appts.map(a =>
      `<div class="detail"><strong>${esc(a.name)}</strong> – ${a.time}</div>
       <div class="detail">${esc(a.services.join(', '))}</div>
       ${a.stylist ? `<div class="detail" style="color:#888">👤 ${esc(a.stylist)}</div>` : ''}
       <hr style="margin:8px 0; border-color:#eee">`
    ).join('');
    openModal(`<div class="detail"><strong>📅 ${fmtDate(dateStr)}</strong></div><hr style="margin:8px 0"><br>${body}`);
  }

  // ── WEEK / DAY VIEW ────────────────────────────────────────────────
  const COLOURS = ['', 'orange', 'pink', 'blue', '', 'orange', 'pink'];

  function renderWeekDay() {
    const appts    = getAppointments();
    const todayStr = toDateStr(today);

    let days = [];
    if (calView === 'week') {
      const dow = (calDate.getDay() + 6) % 7;
      for (let i = 0; i < 7; i++) {
        const d = new Date(calDate);
        d.setDate(d.getDate() - dow + i);
        days.push(d);
      }
      const first = days[0], last = days[6];
      document.getElementById('cal-title').textContent =
        first.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ' – ' +
        last.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    } else {
      days = [new Date(calDate)];
      document.getElementById('cal-title').textContent =
        calDate.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    }

    const cols     = days.length;
    const gridCols = `70px repeat(${cols}, 1fr)`;

    const apptMap = {};
    appts.forEach(a => {
      const hour = parseInt(a.time.split(':')[0], 10);
      const key  = a.date + '_' + hour;
      (apptMap[key] = apptMap[key] || []).push(a);
    });

    let html = `<div class="week-view">
      <div class="week-header-row" style="display:grid; grid-template-columns:${gridCols}">
        <div class="time-col"></div>
        ${days.map((d) => {
          const isToday = toDateStr(d) === todayStr;
          return `<div class="week-day-head${isToday ? ' today' : ''}">
            <div class="day-num">${d.getDate()}</div>
            <div>${d.toLocaleDateString('en-GB',{weekday:'short'})}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="week-body">`;

    for (let h = 8; h <= 20; h++) {
      const label = h < 12 ? h + ':00 am' : h === 12 ? '12:00 pm' : (h - 12) + ':00 pm';
      html += `<div class="week-time-row" style="display:grid; grid-template-columns:${gridCols}">
        <div class="time-label">${label}</div>
        ${days.map((d, ci) => {
          const key      = toDateStr(d) + '_' + h;
          const dayAppts = apptMap[key] || [];
          const inner    = dayAppts.map((a, ai) =>
            `<div class="week-appt ${COLOURS[(ci + ai) % COLOURS.length]}" onclick="openApptModal('${a.id}')">
              ${esc(a.name)}<br><small>${esc(a.services[0])}</small>
            </div>`
          ).join('');
          return `<div class="week-cell">${inner}</div>`;
        }).join('')}
      </div>`;
    }

    html += '</div></div>';
    document.getElementById('cal-container').innerHTML = html;
  }

  function openApptModal(id) {
    const a = getAppointments().find(x => x.id === id);
    if (!a) return;
    openModal(`
      <div class="detail"><strong>👤 Customer:</strong> ${esc(a.name)}</div>
      <div class="detail"><strong>📅 Date:</strong> ${fmtDate(a.date)}</div>
      <div class="detail"><strong>⏰ Time:</strong> ${a.time}</div>
      <div class="detail"><strong>💅 Services:</strong> ${esc(a.services.join(', '))}</div>
      ${a.stylist ? `<div class="detail"><strong>💁 Stylist:</strong> ${esc(a.stylist)}</div>` : ''}
      ${a.notes   ? `<div class="detail"><strong>📝 Notes:</strong> ${esc(a.notes)}</div>`   : ''}
    `);
  }

  // ── MODAL ──────────────────────────────────────────────────────────
  function openModal(html) {
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ── TOAST ──────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── UTILS ──────────────────────────────────────────────────────────
  function toDateStr(d) {
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  function fmtDate(str) {
    if (!str) return '';
    const [y, m, d] = str.split('-');
    return new Date(y, m - 1, d).toLocaleDateString('en-GB', {
      weekday: 'short', day: 'numeric', month: 'long', year: 'numeric'
    });
  }

  function esc(s) {
    return String(s || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // ── INIT ───────────────────────────────────────────────────────────
  document.getElementById('f-date').value = toDateStr(today);
  renderSidebar();
</script>
</body>
</html>
